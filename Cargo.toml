[package]
name = "dns-update"
description = "Dynamic DNS update (RFC 2136 and cloud) library for Rust"
version = "0.5.3"
edition = "2024"
authors = [ "Stalwart Labs <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/dns-update"
homepage = "https://github.com/stalwartlabs/dns-update"
keywords = ["dns", "update", "rfc2136", "dynamic"]
categories = ["network-programming"]
readme = "README.md"
resolver = "2"

[features]
default = ["aws-lc-rs"]
ring = [
    "hickory-proto/dnssec-ring",
    "hickory-net/dnssec-ring",
    "hickory-net/tls-ring",
    "hickory-net/https-ring",
    "dep:ring",
    "reqwest/native-tls",
    "rustls",
    "rustls/ring",
]
aws-lc-rs = [
    "hickory-proto/dnssec-aws-lc-rs",
    "hickory-net/dnssec-aws-lc-rs",
    "hickory-net/tls-aws-lc-rs",
    "hickory-net/https-aws-lc-rs",
    "dep:aws-lc-rs",
    "reqwest/rustls",
    "rustls",
    "rustls/aws-lc-rs",
]
test_provider = []

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
tokio = { version = "1.52", features = ["rt", "net"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
hickory-net = { version = "0.26.1", default-features = false }
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.116", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "gzip", "deflate", "json"]}
serde_urlencoded = { version = "0.7.1", default-features = false }
ring = { version = "0.17", optional = true }
aws-lc-rs = { version = "1.17", optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
quick-xml = { version = "0.40", features = ["serialize"] }
chrono = { version = "0.4" , default-features = false, features = ["std", "clock", "now"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = { version = "1.6" }
httpmock = { version = "0.8", features = ["https"] }
